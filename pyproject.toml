[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "job-apply-agent"
version = "0.1.0"
description = "AI Job Apply Agent — monitor WhatsApp for job links, extract postings, and draft/submit applications"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Ali Hamed"}]

dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
    "annotated-types==0.7.0",
    "anyio==4.14.2",
    "certifi==2026.10.18",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "idna==3.15",
    "pydantic==2.13.4",
    "pydantic-core==2.46.4",
    "pydantic-settings==2.14.2",
    "PyJWT==2.15.0",
    "PyYAML==6.0.3",
    "python-dotenv==1.2.2",
    "redis==5.3.1",
    "msgpack>=1.2.1,<2",
    "sniffio==1.3.1",
    "typing-extensions==4.15.0",
    "typing-inspection==0.4.2",
    # 2.1 defaults postgresql:// to psycopg 3; this project ships psycopg2.
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13,<2",
    "beautifulsoup4>=4.12,<5",
    "lxml>=6.1,<7",
    "celery>=5.3,<6",
    # kombu 5.7 needs redis-py >= 6.1; redis is pinned at 5.3.1.
    "kombu>=5.3,<5.7",
    "cryptography>=50,<51",
    "openai>=1.10,<2",
    "anthropic>=0.18,<1",
    "python-multipart>=0.0.6",
    "structlog>=24.1,<25",
    "jinja2>=3.1,<4",
    "tenacity>=8.2,<9",
    "prometheus-client>=0.20,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.3,<2",
    "pytest-cov>=4.1,<5",
    "httpx",           # for TestClient
    "ruff>=0.2,<1",
    "mypy>=1.8,<2",
    "types-PyYAML",
]
browser = [
    "playwright>=1.48,<2",
]
# PDF resume text extraction (Phase 9)
pdf = [
    "pypdf>=6.14.2,<7",        # primary: pure-Python, no system deps
    "pdfminer.six>=20221105",  # fallback: layout-aware extraction
]
# PostgreSQL support (Phase 9)
postgres = [
    "psycopg2-binary>=2.9,<3",
]
# SMTP email support (Phase 5)
email = [
    "aiosmtplib>=5.1.1,<6",
]

[tool.setuptools.packages.find]
include = [
    "api*", "control_plane*", "core*", "db*", "discovery*", "ingestion*", "jobs*",
    "llm*", "match*", "profile*", "submitters*", "worker*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
