<html>
 <body>
  <form enctype="multipart/form-data" id="application-form" method="POST">
   <div class="section page-centered application-form">
    <h4>
     Submit your application
    </h4>
    <ul>
     <li class="application-question resume">
      <label>
       <div class="application-label">
        Resume/CV
       </div>
       <div class="application-field">
        <a class="postings-btn template-btn-utility visible-resume-upload">
         <span class="filename">
         </span>
         <span class="default-label">
          ATTACH RESUME/CV
         </span>
         <input class="application-file-input invisible-resume-upload" data-qa="input-resume" id="resume-upload-input" name="resume" type="file"/>
        </a>
        <span class="resume-upload-failure">
         <div class="resume-upload-label">
          Couldn't auto-read resume.
         </div>
        </span>
        <span class="resume-upload-working">
         <div class="loading-indicator">
         </div>
         <div class="resume-upload-label">
          Analyzing resume...
         </div>
        </span>
        <span class="resume-upload-success">
         <div class="loading-indicator completed">
         </div>
         <div class="resume-upload-label">
          Success!
         </div>
        </span>
       </div>
      </label>
      <span class="resume-upload-oversize">
       <p class="error-message">
        File exceeds the maximum upload size of
        <b>
         100MB
        </b>
        . Please try a smaller size.
       </p>
      </span>
     </li>
    </ul>
   </div>
   <!--
     HYPOTHETICAL, not observed on a completed submission: Collate's own
     posting has no radio/checkbox questions, so no real capture of their
     exact markup exists yet. The wrapper shape (li.application-question)
     and the survey-question naming convention (cards[<uuid>][fieldN]) ARE
     evidence-backed (see the P1 plan doc's blank-form recon section); the
     specific fields below and, more importantly, each radio <input>'s
     data-option-label attribute are a plausible construction, not a
     captured one -- _options() in lever_v1.py has no fallback for a radio
     option's label the way SELECT does (a synthetic option-{index} id),
     so if a real posting's radio markup turns out not to carry
     data-option-label, real radio questions would SELECTOR_DRIFT today.
     This fixture only proves the page still reaches FORM state with
     radio/checkbox controls present -- there is no dedicated option-parsing
     assertion for this fixture, unlike application_custom_select.html's
     SELECT case, precisely because that parsing is unverified.
   -->
   <div class="section page-centered application-form">
    <h4>
     Additional questions
    </h4>
    <ul>
     <li class="application-question">
      <label>
       <div class="application-label">
        Preferred work mode
        <span class="required">
         ✱
        </span>
       </div>
       <div class="application-field">
        <label>
         <input data-option-id="mode-hybrid" data-option-label="Hybrid" name="cards[11111111-2222-4333-8444-555555555555][field1]" required="" type="radio" value="hybrid"/>
         Hybrid
        </label>
        <label>
         <input data-option-id="mode-remote" data-option-label="Remote" name="cards[11111111-2222-4333-8444-555555555555][field1]" required="" type="radio" value="remote"/>
         Remote
        </label>
       </div>
      </label>
     </li>
     <li class="application-question">
      <label>
       <div class="application-label">
        Receive application updates
       </div>
       <div class="application-field">
        <input name="updates" type="checkbox" value="yes"/>
       </div>
      </label>
     </li>
    </ul>
   </div>
   <input name="accountId" type="hidden"/>
   <input name="linkedInData" type="hidden"/>
   <input name="origin" type="hidden"/>
   <input name="referer" type="hidden"/>
   <input id="applicant-timezone" name="timezone" type="hidden"/>
   <input name="socialReferralKey" type="hidden"/>
   <input name="socialSource" type="hidden"/>
   <input name="resumeStorageId" type="hidden"/>
   <input id="hcaptchaResponseInput" name="h-captcha-response" type="hidden"/>
   <button class="hidden" id="hcaptchaSubmitBtn" type="submit">
   </button>
   <input name="source" type="hidden"/>
   <div class="h-captcha" data-sitekey="e33f87f8-88ec-4e1a-9a13-df9bbb1d8120" id="h-captcha">
   </div>
   <div class="section page-centered application-form last-section-apply">
    <button class="postings-btn template-btn-submit hex-color" data-qa="btn-submit" id="btn-submit" type="button">
     Submit application
    </button>
   </div>
  </form>
 </body>
</html>
