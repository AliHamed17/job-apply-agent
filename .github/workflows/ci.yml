name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobagent
          POSTGRES_PASSWORD: jobagent
          POSTGRES_DB: job_agent_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jobagent"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://jobagent:jobagent@localhost:5432/job_agent_test
      REDIS_URL: redis://localhost:6379/0
      TASKS_ALWAYS_EAGER: "true"
      LLM_PROVIDER: mock
      SECRET_KEY: ci-only-secret
      APP_ENV: test
      USER_PROFILE_PATH: user_profile.yaml.example
      CV_ROUTING_PATH: cv_routing.yaml.example
      CV_DIRECTORY: tests/fixtures/no-personal-cvs
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip
      - name: Install project and verification tools
        run: python -m pip install -e ".[dev,pdf,postgres,email,browser]" pip-audit bandit
      - name: Critical lint
        run: ruff check . --select E9,F63,F7,F82
      - name: Full lint and format for touched Python modules
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git diff --name-only --diff-filter=ACM "$BASE_SHA" "$GITHUB_SHA" -- '*.py' > /tmp/changed-python.txt
          if [ -s /tmp/changed-python.txt ]; then
            xargs ruff check < /tmp/changed-python.txt
            xargs ruff format --check < /tmp/changed-python.txt
          fi
      - name: Full lint for v3 operational modules
        run: >
          ruff check
          core/config.py core/operations.py core/metrics.py
          api/main.py api/routes/dashboard.py api/routes/cv_routing.py
          api/routes/applications.py worker/health.py worker/celery_app.py
          worker/tasks.py profile/cv_routing.py profile/routing_evaluation.py
          profile/models.py submitters/form_brain.py llm/generation.py
          scripts/evaluate_cv_routing.py tests/test_operations.py
          scripts/linkedin_dry_run_smoke.py submitters/browser_trace.py
          submitters/linkedin_v2.py tests/test_cv_routing.py
          tests/test_linkedin_smoke.py
      - name: Typed safety-critical modules
        run: >
          mypy --ignore-missing-imports --disable-error-code var-annotated
          core/config.py core/portal_sessions.py core/application_audit.py
          core/submission_domain.py core/submission_state.py
          profile/cv_intake.py profile/writer.py worker/celery_app.py
          worker/submission_attempts.py submitters/platforms.py
          submitters/base.py
          submitters/employer_workflows.py submitters/confirmation.py
          submitters/workday.py core/async_lifecycle.py
          submitters/workday_v2.py submitters/workday_playwright.py
          submitters/greenhouse.py submitters/greenhouse_api.py
          submitters/greenhouse_identity.py
          submitters/greenhouse_v1.py submitters/greenhouse_playwright.py
          submitters/lever_identity.py submitters/lever_api.py
          submitters/lever.py submitters/lever_v1.py
          submitters/lever_playwright.py
          submitters/ashby_identity.py submitters/ashby_api.py
          submitters/ashby.py submitters/ashby_v1.py
          submitters/ashby_playwright.py
          submitters/smartrecruiters.py submitters/smartrecruiters_identity.py
          submitters/smartrecruiters_api.py submitters/smartrecruiters_v1.py
          submitters/smartrecruiters_playwright.py submitters/registry.py
      - name: Typed v4 submission orchestration
        run: >
          mypy --ignore-missing-imports
          --disable-error-code var-annotated
          --disable-error-code assignment
          --disable-error-code arg-type
          --disable-error-code misc
          --disable-error-code union-attr
          --disable-error-code return-value
          core/submission_service.py core/submit_permits.py
          core/application_mutations.py core/application_revision.py
          core/form_plan_persistence.py
          core/control_plane_review_permits.py
          worker/control_plane_client.py worker/control_plane_event_outbox.py
          worker/control_plane_runner.py worker/submission_commands.py
          api/routes/ats.py
      - name: Typed qualification operations and recovery
        run: >
          mypy --follow-imports=skip --ignore-missing-imports
          --disable-error-code var-annotated
          --disable-error-code assignment
          --disable-error-code arg-type
          --disable-error-code misc
          --disable-error-code union-attr
          --disable-error-code return-value
          api/routes/operations.py
          core/dashboard_operations.py core/control_plane_status.py
          core/operational_labels.py core/operational_metrics.py
          core/v5_operational_metrics.py core/restore_safety.py
          scripts/build_adapter_qualification_matrix.py
          scripts/control_plane_identity.py
          scripts/quarantine_restored_control_plane.py
          scripts/quarantine_restored_runtime.py
      - name: Typed v5 discovery mesh
        run: >
          mypy --follow-imports=skip --ignore-missing-imports
          --disable-error-code var-annotated
          --disable-error-code assignment
          --disable-error-code arg-type
          --disable-error-code misc
          --disable-error-code union-attr
          --disable-error-code return-value
          api/routes/discovery.py
          discovery/catalog.py discovery/contracts.py
          discovery/generic_sources.py discovery/gmail_alerts.py
          discovery/http_client.py discovery/locks.py discovery/mesh.py
          discovery/persistence.py discovery/public_sources.py
          discovery/search_intents.py discovery/settings.py
          discovery/source_adapters.py
          worker/discovery_tasks.py
      - name: Typed v5 calibrated fit and routing
        run: >
          mypy --follow-imports=skip --ignore-missing-imports
          --disable-error-code var-annotated
          --disable-error-code assignment
          --disable-error-code arg-type
          --disable-error-code misc
          --disable-error-code union-attr
          --disable-error-code return-value
          match/job_fit.py match/job_fit_runtime.py match/job_fit_store.py
          api/routes/jobs.py worker/tasks.py
          scripts/evaluate_v5_fit_routing.py
          scripts/qualify_local_fit_routing.py
      - name: Typed v5 signed autopilot authority
        run: >
          mypy --follow-imports=skip --ignore-missing-imports
          core/automation_authority_fence.py
          core/automation_policy.py core/automation_policy_keys.py
          core/automation_policy_service.py core/adapter_qualification_service.py
          core/submission_service.py
          core/submit_permits.py api/routes/automation.py
          worker/autopilot.py worker/autopilot_inspection.py
          worker/control_plane_client.py worker/control_plane_runner.py
          worker/submission_commands.py
      - name: Typed local intelligence and form planning
        run: >
          mypy --follow-imports=skip --ignore-missing-imports
          --disable-error-code var-annotated
          --disable-error-code assignment
          --disable-error-code arg-type
          --disable-error-code misc
          --disable-error-code union-attr
          --disable-error-code return-value
          core/config.py core/operations.py core/runtime_identity.py
          core/form_plan_evidence.py core/form_planning.py core/material_audit.py
          core/sensitive_policy.py
          llm/contracts.py llm/execution_guard.py llm/ollama_runtime.py
          llm/client.py llm/claim_evidence.py llm/generation.py
          llm/qualification_registry.py
          llm/private_generation.py llm/outreach.py llm/culture_fit.py
          llm/interview_prep.py llm/followup_planner.py
          llm/salary_negotiator.py llm/interview_simulator.py llm/vision.py
          profile/models.py profile/cv_content_cache.py profile/cv_facts.py
          profile/cv_routing_llm.py profile/builder.py
          submitters/form_brain.py worker/submission_commands.py
          worker/task_dispatch.py worker/tasks.py api/routes/applications.py
          api/routes/realign.py api/routes/runtime.py
          scripts/evaluate_v4_local_model_qualification.py
          scripts/build_v4_local_model_material_fixtures.py
      - name: PostgreSQL migrations
        run: |
          alembic upgrade head
          alembic downgrade 003_v2_tables
          alembic upgrade head
      - name: Tests
        run: pytest -q --cov=api --cov=core --cov=profile --cov=worker --cov-report=term-missing
      - name: Offline quality contract
        run: |
          python scripts/evaluate_v4_quality.py --check
          python scripts/build_adapter_qualification_matrix.py --check
          python scripts/build_v5_fit_routing_dataset.py
          python scripts/evaluate_v5_fit_routing.py
          git diff --exit-code -- \
            docs/qualification/v4-quality-baseline.json \
            docs/qualification/v4-quality-baseline.md \
            docs/qualification/adapter-matrix.json \
            docs/qualification/adapter-matrix.md \
            tests/fixtures/v5/fit_routing_240.json \
            docs/qualification/v5-fit-routing.json \
            docs/qualification/v5-fit-routing.md
      - name: Exact local-model qualification artifact
        run: |
          python scripts/build_v4_local_model_material_fixtures.py
          python scripts/evaluate_v4_local_model_qualification.py \
            --validate-report docs/qualification/v4-local-model-qualification.json \
            --check
          git diff --exit-code -- \
            tests/fixtures/v4/local_model_full_material_40.json \
            docs/qualification/v4-local-model-qualification.json \
            docs/qualification/v4-local-model-qualification.md
      - name: Dependency audit
        run: pip-audit . --timeout 60
      - name: Static security scan
        run: >
          bandit -q -lll
          api/main.py api/routes/applications.py api/routes/automation.py
          api/routes/cv_routing.py
          api/routes/dashboard.py api/routes/discovery.py api/routes/operations.py
          api/routes/realign.py api/routes/runtime.py
          core/application_audit.py core/automation_authority_fence.py
          core/automation_policy.py
          core/automation_policy_keys.py core/automation_policy_service.py
          core/adapter_qualification_service.py
          core/config.py core/form_plan_evidence.py
          core/form_planning.py core/form_plan_persistence.py
          core/material_audit.py core/operations.py core/runtime_identity.py
          core/dashboard_operations.py core/operational_labels.py
          core/operational_metrics.py core/control_plane_status.py
          core/v5_operational_metrics.py core/restore_safety.py
          core/sensitive_policy.py core/submission_domain.py core/submission_service.py
          core/submit_permits.py
          core/control_plane_review_permits.py core/utils.py db/models.py
          discovery/catalog.py discovery/contracts.py discovery/generic_sources.py
          discovery/gmail_alerts.py discovery/http_client.py discovery/locks.py
          discovery/mesh.py discovery/persistence.py discovery/public_sources.py
          discovery/search_intents.py discovery/settings.py discovery/source_adapters.py
          submitters/smartrecruiters.py submitters/smartrecruiters_identity.py
          submitters/smartrecruiters_api.py submitters/smartrecruiters_v1.py
          submitters/smartrecruiters_playwright.py
          llm/client.py llm/generation.py llm/prompts.py
          llm/claim_evidence.py llm/contracts.py
          llm/execution_guard.py llm/ollama_runtime.py
          llm/qualification_registry.py
          llm/private_generation.py llm/outreach.py llm/culture_fit.py
          llm/interview_prep.py llm/followup_planner.py
          llm/salary_negotiator.py llm/interview_simulator.py llm/vision.py
          profile/builder.py profile/cv_content_cache.py profile/cv_facts.py
          profile/cv_intake.py
          profile/cv_routing_llm.py profile/models.py
          match/job_fit.py match/job_fit_runtime.py match/job_fit_store.py
          scripts/build_v5_fit_routing_dataset.py
          scripts/evaluate_v5_fit_routing.py scripts/qualify_local_fit_routing.py
          scripts/evaluate_v4_local_model_qualification.py
          scripts/build_v4_local_model_material_fixtures.py
          scripts/build_adapter_qualification_matrix.py
          scripts/automation_policy_key.py
          scripts/control_plane_identity.py
          scripts/quarantine_restored_control_plane.py
          scripts/quarantine_restored_runtime.py
          submitters/form_brain.py submitters/registry.py
          submitters/workday_v2.py submitters/workday_playwright.py
          submitters/greenhouse.py submitters/greenhouse_api.py
          submitters/greenhouse_identity.py
          submitters/greenhouse_v1.py submitters/greenhouse_playwright.py
          submitters/lever_identity.py submitters/lever_api.py
          submitters/lever.py submitters/lever_v1.py
          submitters/lever_playwright.py
          submitters/ashby_identity.py submitters/ashby_api.py
          submitters/ashby.py submitters/ashby_v1.py
          submitters/ashby_playwright.py
          worker/celery_app.py
          worker/autopilot.py worker/autopilot_inspection.py
          worker/control_plane_client.py worker/control_plane_event_outbox.py
          worker/control_plane_runner.py worker/submission_commands.py
          worker/task_dispatch.py worker/tasks.py
      - name: Compose validation
        run: cp .env.example .env && docker compose config --quiet

  control-plane-privacy:
    name: Isolated control plane and privacy boundary (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: control
          POSTGRES_PASSWORD: control
          POSTGRES_DB: control_plane_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U control -d control_plane_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CONTROL_DATABASE_URL: >-
        postgresql://control:control@localhost:5432/control_plane_test?sslmode=disable
      CONTROL_POSTGRES_TEST_URL: >-
        postgresql+psycopg://control:control@localhost:5432/control_plane_test?sslmode=disable
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: control_plane/requirements.txt
      - name: Install isolated control plane
        working-directory: control_plane
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r requirements.txt \
            bandit httpx==0.28.1 pip-audit pytest pyyaml ruff
      - name: Verify root deployment privacy boundary
        run: |
          python -m ruff check api/vercel.py tests/test_control_plane_bundle_privacy.py
          python -m ruff format --check api/vercel.py tests/test_control_plane_bundle_privacy.py
          python -m pytest -q --noconftest tests/test_control_plane_bundle_privacy.py
      - name: Lint isolated control plane
        working-directory: control_plane
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Test isolated control plane
        working-directory: control_plane
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head
          python -m pytest -q tests
      - name: Audit isolated control plane
        working-directory: control_plane
        run: |
          python -m pip_audit -r requirements.txt --timeout 60
          python -m bandit -q -lll -r api job_control_plane

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build --target web-api -t job-agent-api:ci .
      - name: Scan API image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: job-agent-api:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure safe dry-run environment
        run: |
          cp .env.example .env
          sed -i 's/^LLM_PROVIDER=.*/LLM_PROVIDER=mock/' .env
          mkdir -p profile-data
      - name: Start operational stack
        run: docker compose up -d --build postgres redis web-api celery-worker celery-beat
      - name: Require API and worker readiness
        run: |
          for attempt in $(seq 1 36); do
            if curl --fail --silent http://127.0.0.1:8000/health/ready; then
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs web-api celery-worker celery-beat
          exit 1
      - name: Stop operational stack
        if: always()
        run: docker compose down --volumes

  whatsapp-bridge:
    name: WhatsApp bridge contract tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: bridge/package-lock.json
      - name: Install bridge dependencies
        run: npm ci
      - name: Run bridge tests and syntax checks
        run: |
          npm test
          node --check whatsapp_bridge.js
          node --check archive_scan_scheduler.js

  windows-runtime:
    name: Windows private runtime and ownership contracts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install runtime test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,postgres]"
      - name: Verify PowerShell runtime and WhatIf contracts
        shell: pwsh
        run: ./tests/windows/JobAgent.Runtime.Tests.ps1
      - name: Verify identity and Compose privacy contracts
        shell: pwsh
        run: >
          python -m pytest -q
          tests/test_windows_runtime_assets.py
          tests/test_control_plane_identity.py
          tests/test_control_plane_runner.py
          tests/test_config.py
